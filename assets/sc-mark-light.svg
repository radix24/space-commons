<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Space Commons">
  <title>Space Commons</title>
  <defs>
    <linearGradient id="sc-dome-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#2B2F7A"/>
    </linearGradient>
  </defs>
  <!-- orbit, far half: passes behind the dome -->
  <path d="M5.69 43.58 A28 10 -20 0 1 58.31 24.42" fill="none" stroke="#4FE3C1" stroke-width="2.8" stroke-linecap="round" opacity=".5"/>
  <!-- the sky dome seen from the ground -->
  <path d="M12 42 A20 20 0 0 1 52 42 Z" fill="url(#sc-dome-l)"/>
  <!-- shared horizon -->
  <path d="M7 42 H57" stroke="#14183A" stroke-width="3.4" stroke-linecap="round"/>
  <!-- orbit, near half: crosses in front of the dome and the horizon -->
  <path d="M58.31 24.42 A28 10 -20 0 1 5.69 43.58" fill="none" stroke="#4FE3C1" stroke-width="2.8" stroke-linecap="round"/>
  <!-- the traveller on the orbit -->
  <circle cx="49.89" cy="36.21" r="3.6" fill="#14183A"/>
</svg>
