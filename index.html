<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Commons</title>
<meta name="description" content="Space Commons — 브라우저에서 보는 별·NGC 천체·태양계 플라네타리움">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="sel-ring" hidden></div>

<div id="topbar">
  <div id="brand">✦ Space <b>Commons</b></div>
  <input id="search" list="search-list" placeholder="검색: M31, NGC 7000, Jupiter, Sirius…" autocomplete="off">
  <datalist id="search-list"></datalist>
  <span id="status">카탈로그 불러오는 중…</span>
</div>

<div id="panel">
  <div class="row"><b id="clock">—</b></div>
  <div class="row">
    <button data-speed="-3600">⏪</button>
    <button data-speed="-60">◀◀</button>
    <button data-speed="1">▶ 실시간</button>
    <button data-speed="60">▶▶</button>
    <button data-speed="3600">⏩</button>
    <button data-speed="0">⏸</button>
    <button id="now">지금</button>
  </div>
  <div class="row">
    <label>위도 <input id="lat" type="number" step="0.01" value="37.57"></label>
    <label>경도 <input id="lon" type="number" step="0.01" value="126.98"></label>
  </div>
  <div class="row toggles">
    <label><input type="checkbox" id="t-ground" checked> 지면</label>
    <label><input type="checkbox" id="t-atm" checked> 대기</label>
    <label><input type="checkbox" id="t-lines" checked> 별자리선</label>
    <label><input type="checkbox" id="t-grid"> 적도 격자</label>
    <label><input type="checkbox" id="t-dso" checked> NGC/IC</label>
    <label><input type="checkbox" id="t-labels" checked> 이름</label>
  </div>
  <div class="row small" id="fovinfo"></div>
</div>

<div id="info" hidden>
  <button id="info-close">×</button>
  <h2 id="info-title"></h2>
  <div id="info-sub"></div>
  <table id="info-table"></table>
  <img id="info-img" alt="" hidden>
  <div class="row"><button id="info-goto">이동 · 확대</button></div>
</div>

<div id="help">드래그: 회전 · 휠/핀치: 확대 · 클릭: 선택 · 더블클릭: 이동·확대</div>

<script type="module" src="app.js"></script>
</body>
</html>
