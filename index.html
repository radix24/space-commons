<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Commons</title>
<meta name="description" content="Space Commons: 땅에서 올려다보고, 우주로 나아가는 모두의 하늘. 브라우저 플라네타리움과 태양계 비행.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A0D1C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="loader">
  <img src="assets/sc-mark.svg" alt="" class="loader-mark">
  <div class="wordmark">Space <span>Commons</span></div>
  <div class="tagline">땅에서 올려다보고, 우주로 나아가는 모두의 하늘</div>
  <div class="loader-bar"><i></i></div>
  <div id="loader-step">별 4만 개와 NGC/IC 천체 1만 2천 개를 불러오는 중</div>
</div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="sel-ring" hidden></div>
<div id="eye-ring" hidden><span id="eye-label"></span></div>

<div id="topbar">
  <a id="brand" href="./"><img src="assets/sc-mark.svg" alt=""><span>Space <em>Commons</em></span></a>
  <input id="search" list="search-list" placeholder="검색: M31, NGC 7000, Jupiter, Sirius…" autocomplete="off">
  <datalist id="search-list"></datalist>
  <div id="modes" role="tablist">
    <button data-mode="ground" class="on">지상</button>
    <button data-mode="space">우주</button>
  </div>
  <div id="tools">
    <button id="tonight-btn" class="ground-only" title="지금 볼 수 있는 천체 (T)">지금 하늘</button>
    <button id="tour-btn" title="주요 천체를 차례로 둘러봅니다">투어</button>
    <button id="share" title="지금 보는 화면의 링크 복사">링크</button>
    <button id="night" title="눈의 암순응을 지키는 붉은 화면 (N)">야간 시야</button>
    <button id="shot" title="화면 저장 (P)">캡처</button>
    <button id="full" title="전체 화면 (F)">전체 화면</button>
  </div>
  <span id="status">카탈로그 불러오는 중…</span>
</div>

<div id="panel">
  <div class="row"><b id="clock">—</b></div>
  <div class="row">
    <button data-speed="-3600" title="1초에 1시간씩 거꾸로">−1시간</button>
    <button data-speed="-60" title="1초에 1분씩 거꾸로">−1분</button>
    <button data-speed="1">실시간</button>
    <button data-speed="60" title="1초에 1분씩">+1분</button>
    <button data-speed="3600" title="1초에 1시간씩">+1시간</button>
    <button data-speed="86400" title="1초에 하루씩">+1일</button>
    <button data-speed="0">정지</button>
    <button id="now">지금</button>
  </div>
  <div class="row">
    <label>날짜·시각 <input id="dt" type="datetime-local"></label>
  </div>
  <div class="row">
    <label class="scrub">시간 끌기 <input id="scrub" type="range" min="-1000" max="1000" value="0"></label><span id="scrub-label" class="small"></span>
  </div>
  <div class="row space-only"><b id="sp-target">지구 주위 공전</b><button id="sp-free">자유 비행</button></div>
  <div class="row ground-only">
    <select id="place" aria-label="관측 장소">
      <option value="">장소 선택</option><option value="seoul">서울</option><option value="busan">부산</option><option value="jeju">제주</option>
      <option value="tokyo">도쿄</option><option value="newyork">뉴욕</option><option value="london">런던</option><option value="sydney">시드니</option>
      <option value="atacama">아타카마 (칠레)</option><option value="maunakea">마우나케아 (하와이)</option><option value="northpole">북극</option>
    </select>
    <select id="eyepiece" aria-label="관측 장비 시야">
      <option value="0">장비 시야 없음</option><option value="7">쌍안경 7×50 (7°)</option><option value="2.6">쌍안경 15×70 (2.6°)</option>
      <option value="1.6">80mm 굴절 · 25mm 접안 (1.6°)</option><option value="0.82">200mm 돕소니안 · 25mm (0.82°)</option>
      <option value="0.33">200mm 돕소니안 · 10mm (0.33°)</option><option value="0.12">200mm · 4mm 고배율 (0.12°)</option>
    </select>
    <label>위도 <input id="lat" type="number" step="0.01" value="37.57"></label>
    <label>경도 <input id="lon" type="number" step="0.01" value="126.98"></label>
  </div>
  <div class="row toggles">
    <label class="ground-only"><input type="checkbox" id="t-ground" checked> 지면</label>
    <label class="ground-only"><input type="checkbox" id="t-atm"> 낮 하늘</label>
    <label class="space-only"><input type="checkbox" id="t-orbits" checked> 궤도</label>
    <label><input type="checkbox" id="t-mw" checked> 은하수</label>
    <label><input type="checkbox" id="t-lines" checked> 별자리선</label>
    <label><input type="checkbox" id="t-grid"> 적도 격자</label>
    <label><input type="checkbox" id="t-dso" checked> NGC/IC</label>
    <label><input type="checkbox" id="t-exo" checked> 외계행성</label>
    <label><input type="checkbox" id="t-labels" checked> 이름</label>
  </div>
  <div class="row small" id="fovinfo"></div>
</div>

<div id="info" hidden>
  <button id="info-close">×</button>
  <h2 id="info-title"></h2>
  <div id="info-sub"></div>
  <table id="info-table"></table>
  <div id="info-exo" hidden></div>
  <img id="info-img" alt="" hidden>
  <div id="info-wiki" hidden>
    <img id="wiki-img" alt="" hidden>
    <p id="wiki-text"></p>
    <a id="wiki-link" target="_blank" rel="noopener"></a>
  </div>
  <div class="row"><button id="info-goto">이동 · 확대</button></div>
</div>

<div id="tonight" hidden>
  <button id="tonight-close">×</button>
  <h2>지금 하늘에 보이는 천체</h2>
  <div id="tonight-sub" class="small"></div>
  <ul id="tonight-list"></ul>
</div>

<div id="tour" hidden>
  <div class="tour-head"><span id="tour-step" class="small"></span><button id="tour-close">×</button></div>
  <p id="tour-text"></p>
  <div class="row"><button id="tour-prev">이전</button><button id="tour-next">다음</button></div>
</div>

<div id="help"><span class="ground-only">드래그: 회전 · 휠/핀치: 확대 · 클릭: 선택 · 더블클릭: 이동·확대</span><span class="space-only">드래그: 공전/시점 · 휠: 거리 · W A S D / Q E: 이동 · Shift: 가속 · 더블클릭: 천체로 비행</span><br>행성 텍스처 © <a href="https://www.solarsystemscope.com/textures/" target="_blank" style="color:inherit">Solar System Scope</a> (CC BY 4.0)</div>

<script type="module" src="app.js"></script>
</body>
</html>
