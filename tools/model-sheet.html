<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model sheet</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }</script>
<style>
  body { margin: 0; background: #0b0c10; color: #d8dbe6; font: 13px/1.4 system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #22252e; }
  .cell { background: #0b0c10; position: relative; }
  .cell canvas { display: block; width: 100%; height: auto; }
  .cell b { position: absolute; left: 8px; top: 6px; font-weight: 600; }
  .cell span { position: absolute; left: 8px; bottom: 6px; color: #8a8fa0; font-size: 11px; }
  .cell.bad span { color: #ff8a7a; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
// Renders every procedural spacecraft from craft.js on one sheet and checks each model for broken geometry.
// Open with ?only=kr for the Korean satellites only. Results: window.__report (also drawn under each tile).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildCraft } from '../craft.js';
const KR = ['KOMPSAT', 'KOMPSAT-5', 'GEO-KOMPSAT', 'GEO-KOMPSAT-B', 'Koreasat', 'CAS500', 'Danuri', 'Microsat', 'CubeSat', 'Nuri', 'MIMAN', 'UEL-Y-Sys', 'BEE-1012', 'SD-1 SAT'];
const ALL = [...KR, 'Cassini', 'Rosetta', 'Dawn', 'MESSENGER', 'OSIRIS-REx', 'Hayabusa2', 'DART', 'Ulysses', 'Solar Orbiter', 'BepiColombo', 'Juice', 'Europa Clipper', 'Lucy', 'Psyche', 'Tiangong'];
const only = new URLSearchParams(location.search).get('only'), names = only === 'kr' ? KR : only ? only.split(',') : ALL;
if (only && only !== 'kr') document.getElementById('grid').style.gridTemplateColumns = `repeat(${names.length}, 1fr)`; // ?only=Nuri for a close look
const one = names.length === 1, W = one ? 640 : 480, H = one ? 960 : 360, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping;
const pm = new THREE.PMREMGenerator(renderer), env = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const report = [];
function check(name, root) {
  const issues = []; let meshes = 0, tris = 0, nan = 0, degenerate = 0, noNormals = 0, emptyGeo = 0, badMat = 0, zeroScale = 0;
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (o.scale && (o.scale.x === 0 || o.scale.y === 0 || o.scale.z === 0)) zeroScale++;
    if (!o.isMesh && !o.isLine && !o.isPoints) return; meshes++;
    const g = o.geometry, p = g?.attributes?.position; if (!p || !p.count) { emptyGeo++; return; }
    for (let i = 0; i < p.array.length; i++) if (!Number.isFinite(p.array[i])) { nan++; break; }
    if (o.isMesh && !g.attributes.normal) noNormals++;
    if (o.isMesh) { const idx = g.index, n = idx ? idx.count : p.count, a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
      tris += n / 3; for (let i = 0; i + 2 < n; i += 3) { const ia = idx ? idx.getX(i) : i, ib = idx ? idx.getX(i + 1) : i + 1, ic = idx ? idx.getX(i + 2) : i + 2;
        a.fromBufferAttribute(p, ia); b.fromBufferAttribute(p, ib); c.fromBufferAttribute(p, ic); if (b.sub(a).cross(c.sub(a)).lengthSq() < 1e-14) degenerate++; } }
    for (const m of [].concat(o.material || [])) { if (!m) { badMat++; continue; } if (m.color && ![m.color.r, m.color.g, m.color.b].every(Number.isFinite)) badMat++; if (m.opacity === 0 && m.transparent) badMat++; }
  });
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  if (!meshes) issues.push('메시 없음'); if (nan) issues.push(`NaN 좌표 ${nan}`); if (emptyGeo) issues.push(`빈 형상 ${emptyGeo}`); if (noNormals) issues.push(`법선 없음 ${noNormals}`);
  if (badMat) issues.push(`재질 문제 ${badMat}`); if (zeroScale) issues.push(`크기 0 ${zeroScale}`);
  if (degenerate > tris * 0.08) issues.push(`면적 0 삼각형 ${degenerate}/${Math.round(tris)}`);
  // cone tips and dish centres make a few zero-area triangles by design, hence the 8% allowance
  const span = Math.max(size.x, size.y, size.z); if (!(span > 0.05 && span < 120)) issues.push(`크기 이상 ${span.toFixed(2)} m`);
  if (centre.length() > span * 0.6) issues.push(`중심이 치우침 ${centre.toArray().map(v => v.toFixed(1)).join(',')}`);
  return { name, meshes, tris: Math.round(tris), parts: root.userData.parts ?? null, size: size.toArray().map(v => +v.toFixed(2)), degenerate, issues };
}
for (const name of names) {
  const cell = document.createElement('div'); cell.className = 'cell'; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cell.append(cv);
  if (one) Object.assign(cv.style, { height: '100vh', width: 'auto', margin: '0 auto' });
  const lab = document.createElement('b'), info = document.createElement('span'); lab.textContent = name; cell.append(lab, info); document.getElementById('grid').append(cell);
  let root; try { root = buildCraft(name); } catch (e) { report.push({ name, issues: ['빌드 오류: ' + e.message] }); info.textContent = '빌드 오류: ' + e.message; cell.classList.add('bad'); continue; }
  if (!root) { report.push({ name, issues: ['빌더 없음'] }); info.textContent = '빌더 없음'; cell.classList.add('bad'); continue; }
  const r = check(name, root); report.push(r);
  info.textContent = `${r.meshes} 메시 · ${r.tris.toLocaleString()} 삼각형 · ${r.size.join(' × ')} m` + (r.issues.length ? ' · ' + r.issues.join(', ') : '');
  if (r.issues.length) cell.classList.add('bad');
  const scene = new THREE.Scene(); scene.environment = env; scene.background = new THREE.Color(0x0b0c10);
  const sun = new THREE.DirectionalLight(0xffffff, 2.6); sun.position.set(4, 6, 5); scene.add(sun, new THREE.AmbientLight(0x404858, 0.6), root);
  const focus = new URLSearchParams(location.search).get('focus'); // ?focus=0,8 frames the part between y = 0 and 8 m (a close look at engines, markings)
  const box = new THREE.Box3().setFromObject(root); if (focus) { const [a, b] = focus.split(',').map(Number); box.min.y = a; box.max.y = b; }
  const c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
  const cam = new THREE.PerspectiveCamera(30, W / H, rad / 100, rad * 100); cam.position.copy(c).add(new THREE.Vector3(1, 0.7, 1.2).normalize().multiplyScalar(rad / Math.sin(15 * Math.PI / 180) * 1.05)); cam.lookAt(c);
  renderer.render(scene, cam); cv.getContext('2d').drawImage(renderer.domElement, 0, 0);
}
window.__report = report; document.body.dataset.done = '1';
</script>
</body>
</html>
